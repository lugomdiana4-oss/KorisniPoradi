<div class="search-box">
  <input type="text"
         placeholder="Пошук..."
         [(ngModel)]="searchTerm"
         (ngModelChange)="onSearch()">
</div>

<div class="items-container">
  <app-item-card
    *ngFor="let item of adviceList"
    [item]="item"
    (select)="onItemSelected(item)">
  </app-item-card>
</div>
