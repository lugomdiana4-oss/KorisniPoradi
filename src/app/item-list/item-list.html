<div class="list-container">
  <h2>Список автомобілів</h2>
  <input
    type="text"
    placeholder="Пошук за брендом або моделлю..."
    [(ngModel)]="search"
    class="search-input">

  <div class="list">
    <app-item-card
      *ngFor="let car of filteredCars"
      [car]="car"
      (select)="onCarSelected($event)">
    </app-item-card>
  </div>
</div>
