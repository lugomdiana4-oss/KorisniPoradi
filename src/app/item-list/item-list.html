<div class="list-container">
  <h2>Список автомобілів</h2>

  <input
    type="text"
    placeholder="Пошук за брендом або моделлю..."
    [(ngModel)]="search"
    (input)="onSearchChange()"
    class="search-input"
  />

  <div class="list">
    <app-item-card
      *ngFor="let car of (cars$ | async)"
      [car]="car">
    </app-item-card>
  </div>
</div>
